# Distrobox assemble manifest for the Kocaeli Social Hub dev container.
#
# Syntax verified 2026-10-07 against https://distrobox.it/usage/distrobox-assemble/
# Keys used here: image, additional_packages, pull, replace, start_now, init.
#
# Node is pinned to the official Node 22 LTS image. Vite 8 requires Node
# 20.19+ or 22.12+, so Node 22 satisfies it.
#
# For a byte-exact pin, replace the tag with a digest:
#   image=node:22-bookworm@sha256:<digest>
# The digest form is UNVERIFIED here. The tag form is the verified one.

[kocaeli]
image=node:22-bookworm
additional_packages="git ca-certificates"
pull=true
replace=true
start_now=false
init=false
