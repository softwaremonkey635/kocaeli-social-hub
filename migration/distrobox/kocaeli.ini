# Distrobox assemble manifest for the Kocaeli Social Hub dev container.
#
# Syntax verified 2026-10-07 against https://distrobox.it/usage/distrobox-assemble/
# Keys used: image, additional_packages, pull, replace, start_now, init.
#
# Base image: Fedora 44 toolbox, pinned by tag.
# Node: the Fedora distro package nodejs24 (plus nodejs24-npm-bin for npm). This
#       matches the repo's .nvmrc (24) and satisfies engines.node (>=22). The repo
#       sets no packageManager field, so there is no corepack pin to honour.
#
# No `home` key is set, so distrobox uses its default home (the invoking user's
# home, isolated per container). Set `home=` to a literal absolute path only when
# you want a dedicated container home, and keep that path out of version control.
#
# Create:   distrobox assemble create --file distrobox.ini
# Dry run:  distrobox assemble create --file distrobox.ini --dry-run

[kocaeli]
image=registry.fedoraproject.org/fedora-toolbox:44
additional_packages="git curl ca-certificates"
additional_packages="nodejs24 nodejs24-npm-bin"
additional_packages="fontconfig liberation-fonts noto-sans-fonts"
pull=true
replace=true
start_now=false
init=false
